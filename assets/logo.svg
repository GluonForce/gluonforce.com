<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <g transform="translate(6,4) scale(0.52)">
    <!-- Gluon Force flower/knot logo mark -->
    <g transform="translate(50,50)">
      <!-- Six intertwined petals forming a knot/flower shape -->
      <g stroke="#4a9ece" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Petal 1 - top -->
        <path d="M0,-32 C12,-28 20,-16 16,-4 C12,8 -4,12 -12,4 C-20,-4 -16,-20 -4,-28 C4,-32 0,-32 0,-32" fill="#4a9ece" fill-opacity="0.15"/>
        <!-- Petal 2 - top right -->
        <path d="M28,-16 C28,-4 22,10 10,14 C-2,18 -14,10 -14,0 C-14,-12 -2,-22 12,-24 C20,-26 28,-16 28,-16" fill="#4a9ece" fill-opacity="0.15"/>
        <!-- Petal 3 - bottom right -->
        <path d="M28,16 C20,24 6,28 -6,22 C-16,16 -18,2 -10,-6 C-2,-14 14,-14 24,-4 C30,4 28,16 28,16" fill="#4a9ece" fill-opacity="0.15"/>
        <!-- Petal 4 - bottom -->
        <path d="M0,32 C-12,28 -20,16 -16,4 C-12,-8 4,-12 12,-4 C20,4 16,20 4,28 C-4,32 0,32 0,32" fill="#4a9ece" fill-opacity="0.15"/>
        <!-- Petal 5 - bottom left -->
        <path d="M-28,16 C-28,4 -22,-10 -10,-14 C2,-18 14,-10 14,0 C14,12 2,22 -12,24 C-20,26 -28,16 -28,16" fill="#4a9ece" fill-opacity="0.15"/>
        <!-- Petal 6 - top left -->
        <path d="M-28,-16 C-20,-24 -6,-28 6,-22 C16,-16 18,-2 10,6 C2,14 -14,14 -24,4 C-30,-4 -28,-16 -28,-16" fill="#4a9ece" fill-opacity="0.15"/>
      </g>
      <!-- Center knot overlay -->
      <circle cx="0" cy="0" r="8" fill="#4a9ece" fill-opacity="0.3" stroke="#4a9ece" stroke-width="2"/>
    </g>
  </g>
  <!-- Company name -->
  <text x="62" y="40" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#4a9ece" letter-spacing="-0.5">Gluon Force</text>
</svg>
